<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Dark bg -->
  <rect width="32" height="32" rx="7" fill="#050810"/>

  <!-- Outer subtle ring -->
  <circle cx="16" cy="16" r="12.5" stroke="#6366f1" stroke-width="0.75" stroke-opacity="0.2" stroke-dasharray="2.5 2"/>

  <!-- Magnifying glass circle -->
  <circle cx="14" cy="14" r="6.5" stroke="#6366f1" stroke-width="2" stroke-opacity="0.9"/>

  <!-- Magnifying glass handle -->
  <line x1="19" y1="19" x2="25" y2="25" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Red X inside the lens = threat found -->
  <line x1="11.5" y1="11.5" x2="16.5" y2="16.5" stroke="#ef4444" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="16.5" y1="11.5" x2="11.5" y2="16.5" stroke="#ef4444" stroke-width="1.8" stroke-linecap="round"/>
</svg>
