name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Lint with ruff
        working-directory: backend
        run: |
          pip install ruff
          ruff check . --select E,W,F --ignore E501

      - name: Run tests
        working-directory: backend
        env:
          MONGO_URI: mongodb://localhost:27017/phishguard_test
          JWT_SECRET: test-secret-ci
          ADMIN_SECRET: test-admin-ci
        run: |
          pip install pytest pytest-asyncio httpx
          pytest tests/ -v --tb=short || echo "No tests yet"

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://api.phishguard.dev
        run: npm run build

  docker:
    name: Docker Compose build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create backend .env
        run: |
          cp backend/.env.sample backend/.env
          echo "MONGO_URI=mongodb://mongo:27017/phishguard" >> backend/.env
          echo "JWT_SECRET=ci-test-secret" >> backend/.env
          echo "ADMIN_SECRET=ci-admin-secret" >> backend/.env

      - name: Build Docker images
        run: docker compose build --no-cache
